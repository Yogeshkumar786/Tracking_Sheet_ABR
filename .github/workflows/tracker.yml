name: Vehicle Tracker (hourly)
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch: {}
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tracker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python -m tracking_suite.run_tracker
